<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>CRM Console</title>
  <meta name="description" content="CRM Console - Sign in to access fraud checker and consignment tracking.">
  <meta property="og:title" content="CRM Console">
  <meta property="og:description" content="Sign in to access fraud checker and consignment tracking.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-render-app.com">
  <meta property="og:image" content="/favicon.ico">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ece3de;
      color: #2c2c2c;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 28px 32px;
      box-shadow: 0 8px 40px rgba(133,69,35,0.10), 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(133,69,35,0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
.brand-icon {
      width: 36px;
      height: 36px;
      background: #854523;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon img,
    .brand-icon svg { width: 28px; height: 28px; }
    .login-container h1 {
      font-size: 24px;
      font-weight: 700;
      color: #854523;
      text-align: center;
      letter-spacing: -0.3px;
    }
    .login-container h1 span { color: #956f58; }
    .login-container .subtitle {
      font-size: 14px;
      color: #956f58;
      text-align: center;
      margin-bottom: 32px;
      font-weight: 400;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      border: 1.5px solid #d9d2cb;
      border-radius: 12px;
      outline: none;
      background: #fefcf9;
      color: #2c2c2c;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: #854523;
      box-shadow: 0 0 0 3px rgba(133,69,35,0.12);
    }
    .input-wrap input.invalid { border-color: #c0392b; }
    .input-wrap label {
      font-size: 12px;
      font-weight: 600;
      color: #956f58;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .login-btn {
      width: 100%;
      min-height: 52px;
      background: #854523;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .login-btn:hover:not(:disabled) { background: #956f58; }
    .login-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .login-error {
      background: #fefcf9;
      border: 1px solid rgba(192,57,43,0.15);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      color: #c0392b;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
    .login-error.visible { display: block; }
    .footer { margin-top: 24px; font-size: 11px; color: #d9d2cb; text-align: center; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h1>CRM <span style="color:#956f58;">Console</span></h1>
    </div>
    <p class="subtitle">Sign in to continue</p>
    <div class="input-group">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
      </div>
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter password" autocomplete="off">
      </div>
    </div>
    <button class="login-btn" id="loginBtn">Sign In</button>
    <div class="login-error" id="loginError">Invalid username or password</div>
    <p class="footer">No forgot password option</p>
  </div>
  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('loginError');
      error.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          error.textContent = data.error || 'Invalid credentials';
          error.classList.add('visible');
        }
      } catch (e) {
        error.textContent = 'Network error';
        error.classList.add('visible');
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
