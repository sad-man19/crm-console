services:
  - type: web
    name: crm-console
    env: python
    pythonversion: '3.12.x'
    buildcommand: pip install -r requirements.txt && python -m playwright install chromium
    startcommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    plan: free
    aptpackages:
      - libnss3
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2
      - libatspi2.0-0
      - libxshmfence1
    envvars:
      - key: SECRET_KEY
        value: your-secret-key-here
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin
      - key: STEADFAST_EMAIL
        value: your-email@example.com
      - key: STEADFAST_PASSWORD
        value: your-password
      - key: PATHAO_EMAIL
        value: your-email@example.com
      - key: PATHAO_PASSWORD
        value: your-password
