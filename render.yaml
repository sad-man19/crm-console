services:
  - type: web
    name: crm-console
    env: python
    pythonversion: '3.12.x'
    buildcommand: pip install -r requirements.txt && playwright install
    startcommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    plan: free
    aptpackages:
      - libnss3
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2
      - libatspi2.0-0
      - libxshmfence1
